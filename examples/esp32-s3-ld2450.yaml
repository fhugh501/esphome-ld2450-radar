# Independent LD2450 example. Replace the board definition with your board's
# actual model if your ESP32-S3 hardware needs one.
esphome:
  name: ld2450-example
  friendly_name: LD2450 Example
  min_version: 2026.5.0

esp32:
  variant: ESP32S3
  framework:
    type: esp-idf

packages:
  ld2450_radar: github://fhugh501/esphome-ld2450-radar/packages/ld2450.yaml@main

logger:

api:
  encryption:
    key: !secret ld2450_example_api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:
