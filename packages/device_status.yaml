# Reusable ESP32 identity, diagnostics, and simple status LED controller.
# Required host substitution: device_id
substitutions:
  product_family: "ESPHome Sensor"
  hardware_model: "ESP32-S3"
  status_led_pin: "GPIO48"

globals:
  - id: status_booting
    type: bool
    restore_value: no
    initial_value: "true"
  - id: status_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: status_updating
    type: bool
    restore_value: no
    initial_value: "false"

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Status LED"
    pin: ${status_led_pin}
    num_leds: 1
    channel_colors: GRB
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic

script:
  - id: update_device_status
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(status_updating);'
          then:
            - text_sensor.template.publish:
                id: device_status
                state: "Updating"
            - light.turn_on:
                id: onboard_led
                brightness: 100%
                red: 100%
                green: 100%
                blue: 0%
          else:
            - if:
                condition:
                  lambda: 'return id(status_booting);'
                then:
                  - text_sensor.template.publish:
                      id: device_status
                      state: "Booting"
                  - light.turn_on:
                      id: onboard_led
                      brightness: 100%
                      red: 0%
                      green: 0%
                      blue: 100%
                else:
                  - if:
                      condition:
                        lambda: 'return id(status_active);'
                      then:
                        - text_sensor.template.publish:
                            id: device_status
                            state: "Active"
                        - light.turn_on:
                            id: onboard_led
                            brightness: 10%
                            red: 0%
                            green: 100%
                            blue: 0%
                      else:
                        - text_sensor.template.publish:
                            id: device_status
                            state: "Idle"
                        - light.turn_on:
                            id: onboard_led
                            brightness: 3%
                            red: 100%
                            green: 100%
                            blue: 100%

esphome:
  on_boot:
    - priority: 800
      then:
        - globals.set:
            id: status_booting
            value: "true"
        - script.execute: update_device_status
    - priority: -100
      then:
        - text_sensor.template.publish:
            id: device_identifier
            state: "${device_id}"
        - text_sensor.template.publish:
            id: product_family_diagnostic
            state: "${product_family}"
        - text_sensor.template.publish:
            id: hardware_model_diagnostic
            state: "${hardware_model}"
        - delay: 3s
        - globals.set:
            id: status_booting
            value: "false"
        - script.execute: update_device_status

ota:
  - platform: esphome
    on_begin:
      then:
        - globals.set:
            id: status_updating
            value: "true"
        - script.execute: update_device_status
    on_error:
      then:
        - globals.set:
            id: status_updating
            value: "false"
        - script.execute: update_device_status

text_sensor:
  - platform: template
    id: device_status
    name: "Device Status"
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: device_identifier
    name: "Device Identifier"
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: product_family_diagnostic
    name: "Product Family"
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: hardware_model_diagnostic
    name: "Hardware Model"
    entity_category: diagnostic
    update_interval: never
  - platform: wifi_info
    mac_address:
      name: "ESP32 MAC Address"
      entity_category: diagnostic
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    bssid:
      name: "Connected BSSID"
      entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart ESP32"
    entity_category: diagnostic
