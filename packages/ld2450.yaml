# HLK-LD2450 radar package for ESP32-S3. Keep host Wi-Fi/API/OTA in your device YAML.
uart:
  id: ld2450_uart
  tx_pin: GPIO14
  rx_pin: GPIO13
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450:
  id: ld2450_radar
  uart_id: ld2450_uart

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: "LD2450 Presence"
      id: ld2450_presence
    has_moving_target:
      name: "LD2450 Moving Target"
      id: ld2450_moving_target
    has_still_target:
      name: "LD2450 Still Target"
      id: ld2450_still_target

sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "LD2450 Target Count"
    still_target_count:
      name: "LD2450 Still Target Count"
    moving_target_count:
      name: "LD2450 Moving Target Count"
    target_1:
      x:
        name: "LD2450 Target 1 X"
        disabled_by_default: false
        unit_of_measurement: "in"
        accuracy_decimals: 1
        filters:
          - multiply: 0.03937007874
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
      y:
        name: "LD2450 Target 1 Y"
        disabled_by_default: false
        unit_of_measurement: "in"
        accuracy_decimals: 1
        filters:
          - multiply: 0.03937007874
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
      speed:
        name: "LD2450 Target 1 Speed"
        disabled_by_default: false
        unit_of_measurement: "ft/s"
        accuracy_decimals: 2
        filters:
          - multiply: 0.003280839895
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
      angle:
        name: "LD2450 Target 1 Angle"
        disabled_by_default: false
      distance:
        name: "LD2450 Target 1 Distance"
        disabled_by_default: false
        unit_of_measurement: "ft"
        accuracy_decimals: 2
        filters:
          - multiply: 0.003280839895
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
      resolution:
        name: "LD2450 Target 1 Resolution"
        disabled_by_default: false
        unit_of_measurement: "in"
        accuracy_decimals: 1
        filters:
          - multiply: 0.03937007874
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
    target_2:
      x:
        name: "LD2450 Target 2 X"
        disabled_by_default: false
        unit_of_measurement: "in"
        accuracy_decimals: 1
        filters:
          - multiply: 0.03937007874
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
      y:
        name: "LD2450 Target 2 Y"
        disabled_by_default: false
        unit_of_measurement: "in"
        accuracy_decimals: 1
        filters:
          - multiply: 0.03937007874
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
      speed:
        name: "LD2450 Target 2 Speed"
        disabled_by_default: false
        unit_of_measurement: "ft/s"
        accuracy_decimals: 2
        filters:
          - multiply: 0.003280839895
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
      angle:
        name: "LD2450 Target 2 Angle"
        disabled_by_default: false
      distance:
        name: "LD2450 Target 2 Distance"
        disabled_by_default: false
        unit_of_measurement: "ft"
        accuracy_decimals: 2
        filters:
          - multiply: 0.003280839895
          - timeout:
              timeout: 1s
              value: last
          - throttle_with_priority: 1000ms
      resolution:
        name: "LD2450 Target 2 Resolution"
